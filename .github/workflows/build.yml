name: Build ThermWidget IPA

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iOS app & WidgetKit extension
        run: |
          xcodebuild clean build \
            -project ThermWidget.xcodeproj \
            -scheme ThermWidgetApp \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build"

      - name: Sign with ldid and package TrollStore IPA
        run: |
          APP_PATH="$PWD/build/ThermWidgetApp.app"
          test -d "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          rm -rf Payload/ThermWidgetApp.app/_CodeSignature
          rm -rf Payload/ThermWidgetApp.app/PlugIns/ThermWidgetExtension.appex/_CodeSignature

          ldid -SEntitlements/Widget.entitlements \
            Payload/ThermWidgetApp.app/PlugIns/ThermWidgetExtension.appex/ThermWidgetExtension
          ldid -SEntitlements/App.entitlements \
            Payload/ThermWidgetApp.app/ThermWidgetApp

          zip -qry ThermWidget-TrollStore.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThermWidget-TrollStore-IPA
          path: ThermWidget-TrollStore.ipa
